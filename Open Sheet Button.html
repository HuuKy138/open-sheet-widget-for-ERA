<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mở Google Sheet</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #1a73e8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0c56c7;
    }
  </style>
</head>
<body>
  <button onclick="window.open('https://docs.google.com/spreadsheets/d/1i-NRUa6qy0jNKg_NHjama-mXKLiY77S52Tw4j7T3VJ4/edit?gid=0#gid=0', '_blank')">
    📑 Open Sheet
  </button>
</body>
</html>
